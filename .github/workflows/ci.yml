name: CI

on:
  push:
    branches: [production, 'prod-*']
  pull_request:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same subpath as the Pages build, so the smoke also proves assets and Havok load there.
      BASE_PATH: /Openai-HandshakeGAme/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Server syntax check
        run: node --check server/index.mjs && node --check server/security.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Solo smoke (no multiplayer server)
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/Openai-HandshakeGAme/ > /dev/null && break; sleep 1; done
          timeout 480 node tools/verify-singleplayer.mjs 'http://127.0.0.1:4173/Openai-HandshakeGAme/?scale=4&lowfx'
      - name: Preview log
        if: failure()
        run: cat preview.log || true
